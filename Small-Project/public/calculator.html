<!DOCTYPE html>
<html lang="en">

<head>
    <title>Calculator</title>
</head>

<body>
    <h2>Simple Calculator</h2>
    <input type="number" id="a" placeholder="Enter first number">

    <input type="number" id="b" placeholder="Enter Second number">
    <select id="ope">
        <option>+</option>
        <option>-</option>
        <option>*</option>
        <option>/</option>
        <option>%</option>
    </select>
    <button onclick="calc()">Click me</button>
    <h3 id="result"></h3>
</body>
<script>
    async function calc() {
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const op = document.getElementById('op').value;
        const res = await fetch('/calculate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a, b, op })
        })
        const data = await res.json();
        document.getElementById('result').innerText = "Result " + data.result
    }
</script>

</html>
